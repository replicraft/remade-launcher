[package]
name = "launcher-core"
description = "The headless engine. The interface and the CLI both drive it through typed commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
directories.workspace = true
launcher-catalog.workspace = true
launcher-model.workspace = true
launcher-net.workspace = true
launcher-packages.workspace = true
launcher-providers.workspace = true
launcher-resolver.workspace = true
launcher-storage.workspace = true
futures-util.workspace = true
hex.workspace = true
rayon.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true
launcher-catalog = { workspace = true, features = ["test-keys"] }
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "crypto-rust", "tokio"] }

[lints]
workspace = true
